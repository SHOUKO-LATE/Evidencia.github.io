 <!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mi Tienda Online</title><link rel="stylesheet" href="Style.css"></head><body><aside class="menu"><h1>Mi Tienda</h1><button onclick="inicio()">Inicio</button><button onclick="mostrarTodos()">Productos</button><button onclick="filtrarCategoria('Ropa')"> Ropa</button><button onclick="filtrarCategoria('Electrónica')">Electrónica</button><button onclick="filtrarCategoria('Calzado')">Calzado</button><button onclick="filtrarCategoria('Accesorios')">Accesorios</button><button onclick="mostrarFavoritos()">Favoritos <span id="contadorFavoritos">0</span></button><button onclick="abrirCarrito()">Carrito <span id="contadorCarrito">0</span></button></aside><main class="contenido"><section id="bienvenida" class="bienvenida"><div><h2>Bienvenido a Mi Tiendita Online :)</h2><p>Encuentra ropa, tecnología, calzado y accesorios en un solo lugar.</p><button onclick="mostrarTodos()">Ver productos</button></div></section><header><input id="buscador" class="buscador" placeholder="Buscar productos..." oninput="buscarProductos()"></header><section class="slider"><div id="sliderProductos"></div><button class="slider-btn anterior" onclick="cambiarSlide(-1)">❮</button><button class="slider-btn siguiente" onclick="cambiarSlide(1)">❯</button></section><sn id="productosSeccion"><h2>Productos</h2><div class="productos" id="listaProductos"></div></section></main><div class="modal" id="modalProducto"><div class="modal-contenido"><button class="cerrar" onclick="cerrarModal()">✕</button><div id="contenidoModal"></div></div></div><aside class="carrito" id="carrito"><div class="carrito-header"><h2>Mi carrito</h2><button onclick="cerrarCarrito()">✕</button></div><div id="listaCarrito" class="lista-carrito"></div><div class="carrito-total"><h3>Total: $<span id="totalCarrito">0.00</span></h3><button class="comprar" onclick="comprar()">Comprar</button></div></aside><div id="fondoCarrito" class="fondo-carrito" onclick="cerrarCarrito()"></div><script src="Script.js"></script></body></html>
